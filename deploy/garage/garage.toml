# Almacenamiento de objetos S3-compatible para las imagenes de las obras.
# Un solo nodo para desarrollo. rpc_secret y admin_token NO van aqui: Garage
# los lee de GARAGE_RPC_SECRET y GARAGE_ADMIN_TOKEN (ver scripts/storage).

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

# Lectura publica de las imagenes: http://<bucket>.web.garage.localhost:3902/<clave>.
# Los navegadores resuelven *.localhost a la maquina local.
[s3_web]
bind_addr = "[::]:3902"
root_domain = ".web.garage.localhost"
index = "index.html"

[admin]
api_bind_addr = "[::]:3903"
