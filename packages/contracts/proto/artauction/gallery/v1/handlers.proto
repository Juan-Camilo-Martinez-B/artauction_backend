syntax = "proto3";

package artauction.gallery.v1;

import "artauction/auction/events/v1/events.proto";
import "artauction/catalog/events/v1/events.proto";

// Eventos que gallery-service consume: lo que es de cada persona (proyectos
// propios, obras en el catalogo y obras ganadas) y quien puede verlo.
service GalleryEventHandlerService {
  rpc HandleLotCreated(HandleLotCreatedRequest) returns (HandleLotCreatedResponse);
  rpc HandleAuctionClosed(HandleAuctionClosedRequest) returns (HandleAuctionClosedResponse);
  rpc HandleLotSubmitted(HandleLotSubmittedRequest) returns (HandleLotSubmittedResponse);
  rpc HandleLotListed(HandleLotListedRequest) returns (HandleLotListedResponse);
  rpc HandleLotVisibilityChanged(HandleLotVisibilityChangedRequest) returns (HandleLotVisibilityChangedResponse);
}

message HandleLotCreatedRequest {
  artauction.catalog.events.v1.LotCreated event = 1;
}

message HandleLotCreatedResponse {}

message HandleAuctionClosedRequest {
  artauction.auction.events.v1.AuctionClosed event = 1;
}

message HandleAuctionClosedResponse {}

message HandleLotSubmittedRequest {
  artauction.catalog.events.v1.LotSubmitted event = 1;
}

message HandleLotSubmittedResponse {}

message HandleLotListedRequest {
  artauction.catalog.events.v1.LotListed event = 1;
}

message HandleLotListedResponse {}

message HandleLotVisibilityChangedRequest {
  artauction.catalog.events.v1.LotVisibilityChanged event = 1;
}

message HandleLotVisibilityChangedResponse {}
