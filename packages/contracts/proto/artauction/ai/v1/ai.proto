syntax = "proto3";

package artauction.ai.v1;

import "google/protobuf/struct.proto";

// Fachada de modelos generativos. Es el unico servicio que conoce la clave de
// Gemini; sin clave responde con adaptadores locales deterministas.
service AiService {
  rpc AuditArtwork(AuditArtworkRequest) returns (AuditArtworkResponse);
  rpc DesignGallery(DesignGalleryRequest) returns (DesignGalleryResponse);
}

enum FindingSeverity {
  FINDING_SEVERITY_UNSPECIFIED = 0;
  FINDING_SEVERITY_INFO = 1;
  FINDING_SEVERITY_WARNING = 2;
  FINDING_SEVERITY_CRITICAL = 3;
}

message Finding {
  string code = 1;
  FindingSeverity severity = 2;
  string message = 3;
  // Codigos de evidencia del expediente que sostienen el hallazgo.
  repeated string evidence = 4;
}

// Un dato del expediente: "img1.exif.software" = "Adobe Photoshop".
message EvidenceItem {
  string code = 1;
  string value = 2;
}

message AuditArtworkRequest {
  string lot_id = 1;
  string title = 2;
  string description = 3;
  string materials = 4;
  optional int32 creation_year = 5;
  repeated string image_hashes = 6;
  // Expediente de evidencias armado por audit-service. La IA razona sobre el
  // y no recibe imagenes: asi el costo en tokens es acotado.
  optional string artist_name = 7;
  string declared_dimensions = 8;
  string provenance = 9;
  repeated EvidenceItem evidence = 10;
  // Hallazgos de las reglas deterministas; la IA no puede contradecir uno critico.
  repeated Finding rule_findings = 11;
}

message AuditArtworkResponse {
  string model = 1;
  string prompt_version = 2;
  int32 score = 3;
  bool critical = 4;
  int32 price_min = 5;
  int32 price_max = 6;
  repeated Finding findings = 7;
}

message DesignGalleryRequest {
  google.protobuf.Struct preferences = 1;
  // JSON Schema de la configuracion, definido por el duenio de la galeria. El
  // modelo responde con esa estructura (responseJsonSchema).
  optional google.protobuf.Struct response_schema = 2;
}

message DesignGalleryResponse {
  // Configuracion propuesta. gallery-service la valida antes de guardarla.
  google.protobuf.Struct config = 1;
  string source = 2;
}
