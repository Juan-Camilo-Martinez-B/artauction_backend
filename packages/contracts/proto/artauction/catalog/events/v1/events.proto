syntax = "proto3";

package artauction.catalog.events.v1;

import "artauction/common/v1/common.proto";

// Eventos que publica catalog-service por su outbox.

// Una obra nueva entra en la galeria de su autor.
message LotCreated {
  artauction.common.v1.EventMetadata metadata = 1;
  string lot_id = 2;
  string seller_id = 3;
  string title = 4;
  optional string artist_name = 5;
  // Proyecto propio: no va al catalogo y la galeria lo cuelga en la sala.
  bool personal = 6;
  artauction.common.v1.Visibility visibility = 7;
}

// El vendedor envio la obra a auditoria. Si era un proyecto propio, desde
// ahora es una obra del catalogo.
message LotSubmitted {
  artauction.common.v1.EventMetadata metadata = 1;
  string lot_id = 2;
}

// Un administrador aprobo una obra en revision manual.
message LotPublished {
  artauction.common.v1.EventMetadata metadata = 1;
  string lot_id = 2;
  string seller_id = 3;
  string title = 4;
  int32 score = 5;
  int32 price_min = 6;
  int32 price_max = 7;
}

// Un administrador devolvio la obra a borrador: el vendedor recibe el motivo
// para corregirla y reenviarla a auditoria.
message LotReturnedToDraft {
  artauction.common.v1.EventMetadata metadata = 1;
  string lot_id = 2;
  string seller_id = 3;
  string title = 4;
  string reason = 5;
}

// El autor mostro u oculto un proyecto propio en su galeria publica.
message LotVisibilityChanged {
  artauction.common.v1.EventMetadata metadata = 1;
  string lot_id = 2;
  string owner_id = 3;
  artauction.common.v1.Visibility visibility = 4;
}
