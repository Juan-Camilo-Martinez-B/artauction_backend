name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workspaces:
    name: microservices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint protos
        run: npm run lint:proto -w @artauction/contracts

      - name: Build packages and services
        run: npm run build

      - name: Lint with layer boundaries
        run: npm run lint

      - name: Test packages and services
        run: npm test
